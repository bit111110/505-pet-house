<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#f5efe4">
<title>505 班級寵物小屋</title>
<link rel="preload" href="assets/maps/MAP001.webp" as="image">
<link rel="stylesheet" href="style.css?v=20261006-2358">

<style>
.question-image-wrap{margin:10px 0 14px;text-align:center}
.question-image{display:block;max-width:100%;max-height:280px;margin:0 auto;border-radius:12px;object-fit:contain;background:#fff}
@media(max-width:900px){.question-image{max-height:220px}}
</style>

<style>
#globalWaitingOverlay{
  position:fixed;inset:0;z-index:99999;
  display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(3px);
}
#globalWaitingOverlay.show{display:flex}
.waiting-card{
  min-width:220px;max-width:80vw;
  padding:24px 28px;border-radius:20px;
  background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.18);
  text-align:center;font-weight:700;font-size:20px;
}
.waiting-spinner{
  width:46px;height:46px;margin:0 auto 14px;
  border:5px solid #ddd;border-top-color:#6e87c4;border-radius:50%;
  animation:waitingSpin .8s linear infinite;
}
.waiting-sub{margin-top:8px;font-size:13px;font-weight:500;color:#777}
@keyframes waitingSpin{to{transform:rotate(360deg)}}
</style>

<style>
.math-frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;line-height:1;margin:0 .12em;min-width:1.25em}
.math-frac .num{display:block;padding:0 .16em .08em;border-bottom:1.8px solid currentColor}
.math-frac .den{display:block;padding:.08em .16em 0}
.pet-pos{touch-action:none}
.pet-pos.dragging{z-index:50;transition:none!important;cursor:grabbing}
.pet-pos.drag-fall{transition:top .45s cubic-bezier(.2,.8,.3,1.25),left .15s ease!important}
.pet-pos{cursor:grab}
#adminPasswordModal{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#adminPasswordModal.show{display:flex}
.admin-password-card{width:min(360px,88vw);background:#fff;border-radius:18px;padding:22px;box-shadow:0 16px 45px rgba(0,0,0,.28)}
.admin-password-card input{width:100%;box-sizing:border-box;font-size:20px;padding:10px 12px;margin:10px 0}
.bulk-admin-card{margin:10px 0 14px;padding:12px;border:1px solid #ddd;border-radius:14px;background:#fafafa}
.bulk-admin-card .row{gap:8px;flex-wrap:wrap}
.batch-exp-toolbar{margin:10px 0;padding:10px;border:1px solid #ddd;border-radius:12px;background:#fafafa}
</style>

<style>
.subjectcard.subject-disabled{opacity:.58;filter:grayscale(.55)}
.subjectcard.subject-disabled .btn{cursor:not-allowed}
</style>
</head>
<body>
<div id="loginView" class="app"><div class="card login"><h1>🐾 班級寵物小屋 V5.10.5</h1><p>學號＋生日（月／日）登入</p><input id="sid" placeholder="學號，例如 50501"><input id="bday" type="text" inputmode="numeric" maxlength="5" placeholder="生日（月/日），例如 09/08"><div class="nav"><button class="btn" onclick="login()">登入</button><button class="btn gray" onclick="openAdmin()">老師後台</button></div><p id="loginMsg"></p></div></div>

<div id="studentView" class="hidden">
  <div class="top"><div><b id="studentName">學生</b> 的寵物小屋 <span class="small" id="ver"></span> <span class="small">前端 20261006-2358</span></div><div class="coins">🪙 <span id="coins">0</span></div></div>
  <div class="app layout">
    <div class="main-stage-wrap">
      <div class="main-mode-tabs">
        <button id="homeModeBtn" class="modebtn active" onclick="switchMainMode('home')">🏠 小屋畫面</button>
        <button id="battleModeBtn" class="modebtn" onclick="switchMainMode('battle')">⚔️ 對戰畫面</button>
      </div>
      <div id="yard" class="yard"><div class="zone sky"></div><div class="zone ground"></div><div class="zone-label sky">天空區</div><div class="zone-label ground">地面區</div><div id="landTitle" class="land-title">草地</div></div>
      <div id="battleMain" class="battle-main hidden"></div>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tabbtn active" data-tab="home" onclick="switchTab('home',this)">🏠 小屋</button>
        <button class="tabbtn" data-tab="upgrade" onclick="switchTab('upgrade',this)">⬆️ 升級</button>
        <button class="tabbtn" data-tab="bag" onclick="switchTab('bag',this)">🎒 道具</button>
        <button class="tabbtn" data-tab="challenge" onclick="switchTab('challenge',this);switchMainMode('battle')">⚔️ 對戰</button>
        <button class="tabbtn" data-tab="mail" onclick="switchTab('mail',this)">📬 信箱<span id="mailBadge" class="badge hidden">0</span></button>
        <button class="tabbtn" data-tab="shop" onclick="switchTab('shop',this)">🛒 土地/背景</button>
      </div>
      <div id="panel" class="panel"></div>
      <div class="nav"><button class="btn gray" onclick="logout()">登出</button><button class="btn" onclick="refreshState()">重新整理</button></div>
    </div>
  </div>
</div>

<div id="adminView" class="app hidden"><div class="card"><h2>👩‍🏫 老師後台</h2><p>發放金幣、道具、寵物。寵物仍然只有老師能分配。</p><div class="nav"><button class="btn" onclick="loadAdmin()">重新整理</button><button class="btn gray" onclick="logout()">回登入</button></div><div id="adminArea" style="overflow:auto;margin-top:10px"></div></div></div>

<div id="purchaseBusyOverlay" class="purchase-busy hidden" aria-live="polite" aria-busy="true">
  <div class="purchase-busy-box">
    <div class="purchase-busy-icon">🪙</div>
    <div><span id="purchaseBusyText">購買中</span><span id="purchaseBusyDots">.</span></div>
    <div class="small">正在寫入資料，請不要重複點擊或切換頁面。</div>
  </div>
</div>
<script src="config.js?v=20261006-2358"></script>
<script src="app.js?v=20261006-2358"></script>

<div id="globalWaitingOverlay" aria-live="polite" aria-busy="true">
  <div class="waiting-card">
    <div class="waiting-spinner"></div>
    <div id="globalWaitingText">等待中...</div>
    <div class="waiting-sub">資料處理中，請稍候</div>
  </div>
</div>

<div id="adminPasswordModal">
  <div class="admin-password-card">
    <h3 style="margin-top:0">🔐 老師後台</h3>
    <div class="small">請輸入老師後台密碼</div>
    <input id="adminPasswordInput" type="password" autocomplete="current-password" placeholder="密碼">
    <div class="row" style="justify-content:flex-end">
      <button class="btn gray" id="adminPasswordCancel">取消</button>
      <button class="btn blue" id="adminPasswordOk">登入</button>
    </div>
  </div>
</div>
</body>
</html>
